[package]
name = "kitty-copy-pager"
version = "0.1.0"
edition = "2024"

[features]
dhat-heap = ["dhat"]

[dependencies]
dhat = { version = "0.3.3", optional = true }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["osc52", "use-dev-tty"] }
log = "0.4.29"
regex = "1.12.3"
simplelog = "0.12.2"
unicode-segmentation = "1.12"
unicode-width = "0.2.2"
vte = { version = "0.14.1", default-features = false }

[dev-dependencies]
portable-pty = "0.9.0"
